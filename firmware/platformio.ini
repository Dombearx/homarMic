; Pilot glosowy - firmware (PlatformIO, Arduino, Seeed XIAO ESP32-S3)
;   pio run -t upload          wgranie przez USB-C
;   pio device monitor         podglad logow
[env:voice-mic]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
